<!DOCTYPE html>
<html>
<head>
<title>College Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
height:100vh;
margin:0;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(135deg,#667eea,#764ba2);
font-family: 'Segoe UI', sans-serif;
overflow:hidden;
}

/* Animated background glow */
body::before{
content:"";
position:absolute;
width:400px;
height:400px;
background:rgba(255,255,255,0.1);
border-radius:50%;
top:-100px;
left:-100px;
filter:blur(80px);
}

body::after{
content:"";
position:absolute;
width:400px;
height:400px;
background:rgba(255,255,255,0.1);
border-radius:50%;
bottom:-100px;
right:-100px;
filter:blur(80px);
}

/* Glass Card */
.welcome-box{
backdrop-filter: blur(15px);
background: rgba(255,255,255,0.1);
padding:60px;
border-radius:20px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
color:white;
width:350px;
transition:0.4s;
}

.welcome-box:hover{
transform:translateY(-10px);
}

/* Title */
.welcome-box h1{
margin-bottom:20px;
font-weight:700;
font-size:28px;
}

/* Subtitle */
.welcome-box p{
opacity:0.8;
margin-bottom:30px;
}

/* Button */
.btn-custom{
background: linear-gradient(45deg,#ff7eb3,#ff758c);
color:white;
padding:12px 30px;
border:none;
border-radius:30px;
font-size:16px;
font-weight:bold;
transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.btn-custom:hover{
transform:scale(1.08);
background: linear-gradient(45deg,#43e97b,#38f9d7);
}

/* Icon animation */
.icon{
font-size:50px;
margin-bottom:15px;
animation: float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

</style>

</head>

<body>

<div class="welcome-box">

<div class="icon">🎓</div>

<h1>College Management</h1>

<p>Manage Students, Lecturers</p>

<button onclick="goToHome()" class="btn-custom">
Enter Dashboard →
</button>

</div>

<script>
function goToHome(){
window.location.href="home.html";
}
</script>

</body>
</html>
